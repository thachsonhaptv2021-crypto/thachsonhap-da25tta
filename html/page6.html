<!DOCTYE html>
<html lang="vi">
	<head>
			<title>Tính diện tích hình chữ nhật</title>
			<meta charset="utf-8">
	
	</head>
	<body>
	<script>
		let d= Number(prompt("Hãy nhập chiều dài hình chữ nhật:"));
		let r= Number(prompt("Hãy nhập chều rộng hinh chưc nhật:"));
		if(d<r)
			alert("Chiều dài phải lớn hơn chiều rộng");
		else
		if(d==r)
			alert("Trường hợp đặt biệt là hình vuông" + d*r);
		else
			alert("Diện tích hình chữ nhật là: " + d*r);
	</script>
	
	</body>
</html>
