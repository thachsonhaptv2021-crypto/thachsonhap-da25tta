<html lang="vi">
	<head>
			<title>Trang alert</title>
			<meta charset="utf-8">
			
	</head>
	<body>
	
	
	<script>
	let name = prompt("Hãy nhập tên của bạn ");
	let yob = Number(prompt("Hãy nhập năm sinh của bạn"));
	window.alert("Bạn tên là " + name + " năm nay bạn "+ (2026-yob)+ " tuổi ");
	
	
	</script>
